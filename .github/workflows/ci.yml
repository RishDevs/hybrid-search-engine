name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --python 3.11 --locked
      - run: uv run pytest -q

  quality-gate:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.11 --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data
            artifacts
          key: gate-${{ hashFiles('uv.lock', 'src/hybrid_search/config.py', 'src/hybrid_search/data.py', 'src/hybrid_search/bm25.py', 'src/hybrid_search/embed.py', 'src/hybrid_search/dense.py') }}
      - name: retrieval quality vs results/baseline.json
        run: uv run hse gate --dataset scifact --tolerance 0.5 --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: results/gate/
